<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인카금융서비스 나트랑 연수 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-blue-900 text-white p-6 text-center shadow-lg">
        <h1 class="text-xl font-bold">인카금융서비스(INCAR)</h1>
        <p class="text-sm opacity-80">2026 나트랑 인센티브 트립 가이드</p>
    </header>

    <main class="p-4 space-y-6 pb-20">
        <section class="bg-white rounded-xl p-5 shadow-sm border-l-4 border-red-500">
            <h2 class="text-lg font-bold mb-3 flex items-center">⚠️ 필독 주의사항</h2>
            <ul class="list-disc list-inside space-y-2 text-sm">
                <li><b>전자담배 금지:</b> 베트남 전역 반입/사용 금지</li>
                <li><b>수돗물 주의:</b> 양치 후 생수로 헹구는 것을 권장</li>
                <li><b>안전 관리:</b> 오토바이가 많으므로 길 건널 때 주의</li>
                <li><b>매너:</b> 사찰 방문 시 무릎 위 짧은 옷 지양</li>
            </ul>
        </section>

        <section class="bg-white rounded-xl p-5 shadow-sm border-l-4 border-blue-500">
            <h2 class="text-lg font-bold mb-3 flex items-center">🗣️ 필수 베트남어</h2>
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="p-2 bg-blue-50 rounded"><b>안녕하세요</b><br>씬 짜오</div>
                <div class="p-2 bg-blue-50 rounded"><b>감사합니다</b><br>까멍</div>
                <div class="p-2 bg-blue-50 rounded"><b>얼마예요?</b><br>바오 니우?</div>
                <div class="p-2 bg-blue-50 rounded"><b>고수 빼주세요</b><br>등 쪼 라우 텀</div>
            </div>
        </section>

        <section class="bg-white rounded-xl p-5 shadow-sm border-l-4 border-green-500">
            <h2 class="text-lg font-bold mb-3">🏨 우리 숙소</h2>
            <p class="text-sm font-semibold text-green-700">멜리아 빈펄 깜란 리조트</p>
            <p class="text-xs mt-1">3베드 풀빌라 (임직원 전용)</p>
            <button class="mt-3 w-full py-2 bg-green-600 text-white rounded-lg text-sm" onclick="alert('구글 지도로 연결됩니다.')">지도 보기</button>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-3 text-xs text-gray-500">
        <div class="text-center">🏠<br>홈</div>
        <div class="text-center text-blue-600 font-bold">📋<br>일정표</div>
        <div class="text-center">📞<br>비상연락</div>
    </nav>
</body>
</html>
